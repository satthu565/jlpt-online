name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      - name: Run media edge worker tests (Range 206 & signed cache check)
        run: pnpm test:media-edge

      - name: Run infrastructure and profiles verification gate
        run: pnpm infra:check

      - name: Verify feature scope and implementation coverage (A06)
        run: pnpm features:verify

      - name: Run Mock UI Data & Baseline Gate (I00)
        run: pnpm check:no-mock-ui

      - name: Run Accessibility Verification (SYS-14)
        run: pnpm test:a11y

      - name: Run Security Negative & Hardening Matrix (V06)
        run: pnpm test:security

      - name: Run Multi-Browser Regression Suite (Chromium, WebKit, Firefox) (V06)
        env:
          MEDIA_TOKEN_SECRET: staging_media_token_secret_for_reproducible_smoke_tests
        run: pnpm test:e2e:all-browsers

      - name: Run Stepped Load Capacity Runner (SYS-10 / V06)
        env:
          MEDIA_TOKEN_SECRET: staging_media_token_secret_for_reproducible_smoke_tests
        run: pnpm test:load

      - name: Execute Backup PITR Restore Drill & Log RPO/RTO Timestamps (SYS-08)
        run: node --no-warnings --experimental-strip-types infra/backup/drill-pitr.ts

      - name: Build applications and packages
        run: pnpm build
