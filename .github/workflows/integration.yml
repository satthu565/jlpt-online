name: Integration CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    name: Dev Services & Full Integration Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis-core:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --entrypoint redis-server
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis-cache:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --entrypoint redis-server
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Initialize worker databases
        env:
          PGPASSWORD: postgres_dev_password
        run: |
          psql -h localhost -p 5432 -U postgres -d postgres -f infra/dev/init-workers-db.sql

      - name: Check dev services and worker isolation
        run: pnpm infra:dev:check

      - name: Run code linter
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      - name: Build monorepo packages and apps
        run: pnpm build

      - name: Record immutable CI run evidence
        if: always()
        run: |
          mkdir -p .ci-evidence
          cat <<EOF > .ci-evidence/run-summary.json
          {
            "workflow": "Integration CI",
            "commit": "${{ github.sha }}",
            "baseRef": "${{ github.base_ref || github.ref }}",
            "headRef": "${{ github.head_ref || github.ref }}",
            "actor": "${{ github.actor }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "jobStatus": "${{ job.status }}"
          }
          EOF

      - name: Upload CI Run Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence-${{ github.sha }}
          path: .ci-evidence/
          retention-days: 14
