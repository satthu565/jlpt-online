name: Release and Publish GHCR Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build & Publish Immutable Production Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Release Tag
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [[ "$TAG" != v* ]]; then
            TAG="${{ inputs.tag || 'v0.1.0' }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "owner=${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"

      # Multi-stage image builds for linux/amd64 (T1.1.7 & T1.8.11)
      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/jlpt-web:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/jlpt-web:latest

      - name: Build and Push Admin Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/admin.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/jlpt-admin:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/jlpt-admin:latest

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/jlpt-api:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/jlpt-api:latest

      - name: Build and Push PostgreSQL with WAL-G Image
        uses: docker/build-push-action@v5
        with:
          context: infra/postgres
          file: infra/postgres/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/jlpt-postgres:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/jlpt-postgres:latest

      - name: Generate Release Manifest & Digest Evidence
        run: |
          mkdir -p .release-evidence
          cat <<EOF > .release-evidence/release-${{ steps.vars.outputs.tag }}.json
          {
            "releaseTag": "${{ steps.vars.outputs.tag }}",
            "commitSha": "${{ github.sha }}",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "images": [
              "ghcr.io/${{ steps.vars.outputs.owner }}/jlpt-web:${{ steps.vars.outputs.tag }}",
              "ghcr.io/${{ steps.vars.outputs.owner }}/jlpt-admin:${{ steps.vars.outputs.tag }}",
              "ghcr.io/${{ steps.vars.outputs.owner }}/jlpt-api:${{ steps.vars.outputs.tag }}",
              "ghcr.io/${{ steps.vars.outputs.owner }}/jlpt-postgres:${{ steps.vars.outputs.tag }}"
            ],
            "builder": "${{ github.actor }}",
            "platform": "linux/amd64"
          }
          EOF

      - name: Upload Release Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ steps.vars.outputs.tag }}
          path: .release-evidence/
