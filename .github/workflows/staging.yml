name: Staging Verification & PITR Drill

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  staging-verify:
    name: Staging Compose Profile Small & PITR Drill
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_REPO: jlpt
      IMAGE_REGISTRY: docker.io
      PROFILE: small
      STAGING_API_URL: http://127.0.0.1:4000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run Media Edge Worker Tests (SYS-11 / Range 206 / Signed check before cache)
        run: pnpm test:media-edge

      - name: Run Infrastructure & Profile Verification Gate (A12 / A13)
        run: pnpm infra:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Acceptance: "Không build trên production: image build một lần trong CI"
      - name: Build staging container images once
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building application images tagged with commit SHA: ${IMAGE_TAG}"
          docker build -t jlpt/jlpt-api:${IMAGE_TAG} -t docker.io/jlpt/jlpt-api:${IMAGE_TAG} -f infra/docker/api.Dockerfile .
          docker build --build-arg NEXT_PUBLIC_API_URL=/api/v1 -t jlpt/jlpt-web:${IMAGE_TAG} -t docker.io/jlpt/jlpt-web:${IMAGE_TAG} -f infra/docker/web.Dockerfile .
          docker build --build-arg NEXT_PUBLIC_API_URL=/api/v1 -t jlpt/jlpt-admin:${IMAGE_TAG} -t docker.io/jlpt/jlpt-admin:${IMAGE_TAG} -f infra/docker/admin.Dockerfile .
          docker build -t jlpt/jlpt-postgres:${IMAGE_TAG} -t docker.io/jlpt/jlpt-postgres:${IMAGE_TAG} -f infra/postgres/Dockerfile infra/postgres
          echo "Images built successfully."

      # Acceptance: "Workflow staging tạm trong GitHub Actions dựng compose profile small từ image build một lần"
      # Acceptance: "Staging độc lập dữ liệu worker"
      - name: Deploy temporary staging with profile small
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REPO: jlpt
          IMAGE_REGISTRY: docker.io
          PROFILE: small
        run: |
          echo "Bringing up compose profile small using pre-built images (no build on runtime)..."
          docker compose -f infra/compose/compose.staging.yml up -d || {
            echo "docker compose up -d failed! Dumping logs immediately..."
            docker compose -f infra/compose/compose.staging.yml logs
            exit 1
          }

      - name: Wait for staging services health
        timeout-minutes: 3
        run: |
          echo "Waiting for all staging services to report healthy..."
          for i in {1..30}; do
            API_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4000/api/v1/health || true)
            WEB_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/healthz || true)
            ADMIN_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/healthz || true)
            MAILPIT_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8025/api/v1/info || true)
            WEB_API_PROXY=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/v1/health || true)
            ADMIN_API_PROXY=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/api/v1/health || true)

            echo "Probe $i: API=${API_HEALTH}, Web=${WEB_HEALTH}, Admin=${ADMIN_HEALTH}, Mailpit=${MAILPIT_HEALTH}, WebProxy=${WEB_API_PROXY}, AdminProxy=${ADMIN_API_PROXY}"
            if [ "$API_HEALTH" = "200" ] && [ "$WEB_HEALTH" = "200" ] && [ "$ADMIN_HEALTH" = "200" ] && [ "$MAILPIT_HEALTH" = "200" ] && [ "$WEB_API_PROXY" = "200" ] && [ "$ADMIN_API_PROXY" = "200" ]; then
              echo "All services and same-origin reverse proxy routes healthy!"
              break
            fi
            sleep 5
          done

          if [ "$API_HEALTH" != "200" ] || [ "$WEB_HEALTH" != "200" ] || [ "$ADMIN_HEALTH" != "200" ]; then
            echo "Staging services failed to reach healthy state within timeout! Dumping container logs..."
            docker compose -f infra/compose/compose.staging.yml logs
            exit 1
          fi

      - name: Run Staging Smoke Tests against live containers
        run: |
          echo "Verifying API health payload..."
          curl -fsS http://127.0.0.1:4000/api/v1/health | grep -q "ok"
          echo "Verifying Web health..."
          curl -fsS http://127.0.0.1:3000/healthz
          echo ""
          echo "Verifying Admin health..."
          curl -fsS http://127.0.0.1:3001/healthz
          echo ""
          echo "Verifying Mailpit health..."
          curl -fsS http://127.0.0.1:8025/api/v1/info | grep -qiE "version|database"
          echo "Verifying same-origin Web /api/v1 reverse proxy routing..."
          curl -fsS http://127.0.0.1:3000/api/v1/health | grep -q "ok"
          echo "Verifying same-origin Admin /api/v1 reverse proxy routing..."
          curl -fsS http://127.0.0.1:3001/api/v1/health | grep -q "ok"
          echo "Staging live smoke tests passed!"

      - name: Seed Staging Database for N06 and Integration Auth (I00)
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REPO: jlpt
          IMAGE_REGISTRY: docker.io
          PROFILE: small
        run: |
          echo "Seeding demo package blueprint and initial content..."
          docker compose -f infra/compose/compose.staging.yml exec -T api node dist/src/modules/import/demo-seed.js
          echo "Seeding staging sessions, accounts, and tenant data..."
          docker compose -f infra/compose/compose.staging.yml exec -T postgres psql -U jlpt -d jlpt_staging < tests/fixtures/seed-sessions.sql
          echo "Ensuring demo exam is marked for guest trial..."
          docker compose -f infra/compose/compose.staging.yml exec -T postgres psql -U jlpt -d jlpt_staging -c "UPDATE exams SET description = 'guest_trial' WHERE slug = 'demo-n5-1';"
          echo "Staging database seeded successfully."

      # Browsers for the Playwright projects in tests/playwright.config.ts (chromium, firefox, webkit).
      # The version comes from tests/node_modules, the same binary the runner uses.
      # PRs run the E2E suite on Chromium only (~4 min instead of ~19); main keeps all five browser projects.
      - name: Install Playwright browsers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm --filter @jlpt/tests exec playwright install --with-deps chromium
          else
            pnpm --filter @jlpt/tests exec playwright install --with-deps chromium firefox webkit
          fi

      # Acceptance (I00): "pnpm test:e2e:integration chạy Playwright thật trên staging CI; có fixture đăng ký qua Mailpit và tài khoản staff seed có mật khẩu và TOTP"
      - name: Run Playwright Real API Integration Suite (I00)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          ADMIN_URL: http://127.0.0.1:3001
          STAGING_API_URL: http://127.0.0.1:4000
          MAILPIT_URL: http://127.0.0.1:8025
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm test:e2e:integration -- --project=chromium
          else
            pnpm test:e2e:integration
          fi

      # Acceptance (N06): "Gói demo docs/multi-worker/demo-data: validate->review->publish->thi->review chạy thật trên staging tạm trong CI"
      # Acceptance (N06): "Cross-tenant/IDOR negative matrix pass"
      # Acceptance (N06): "Ghi actual load metrics; không suy ra sức chịu khi chưa đo"
      - name: Run Core Vertical Slice E2E & Demo Package Flow (N06)
        run: |
          pnpm test:e2e:core

      - name: Run Full Staging Scope E2E Integration Suite (A06)
        run: |
          pnpm test:e2e:full

      - name: Run Feature Implementation Verification Gate (A06)
        run: |
          pnpm features:verify

      - name: Run Security Negative Matrix (Cross-tenant, IDOR, RBAC, Lease) (N06)
        run: |
          pnpm test:security

      - name: Run Accessibility Verification (SYS-14)
        run: |
          pnpm test:a11y

      - name: Run Multi-Browser Regression Suite (Chromium, WebKit, Firefox) (V06)
        env:
          MEDIA_TOKEN_SECRET: staging_media_token_secret_for_reproducible_smoke_tests
        run: |
          pnpm test:e2e:all-browsers

      # Acceptance (D01): "pnpm test:lighthouse chạy được trên staging CI và fail khi vượt ngân sách"
      # Acceptance (D01): "Số đo gốc lưu kèm commit SHA; không lấy số máy ảo làm số production"
      # Acceptance (D01): "Ngân sách ban đầu ở chế độ cảnh báo, D04 chuyển thành chặn"
      - name: Run Lighthouse Performance Audit on Staging (D01)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          ADMIN_URL: http://127.0.0.1:3001
          LIGHTHOUSE_BUDGET_MODE: warn
        run: |
          pnpm test:lighthouse

      - name: Upload Lighthouse Performance Reports (D01)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-staging-reports
          path: docs/release/lighthouse/
          if-no-files-found: ignore

      - name: Run Stepped Load Capacity Runner (SYS-10 / V06)
        # Load and restore drills run on main only; they do not depend on a PR's diff.
        if: github.event_name != 'pull_request'
        env:
          MEDIA_TOKEN_SECRET: staging_media_token_secret_for_reproducible_smoke_tests
        run: |
          docker compose -f infra/compose/compose.staging.yml exec -T postgres psql -U jlpt -d jlpt_staging -c "UPDATE exams SET description = 'guest_trial' WHERE slug = 'demo-n5-1';"
          pnpm test:load

      - name: Run Load Baseline & Record Actual Measured Metrics (N06)
        # Load and restore drills run on main only; they do not depend on a PR's diff.
        if: github.event_name != 'pull_request'
        run: |
          pnpm test:load:baseline

      # Acceptance: "Backup PITR khôi phục trên staging tạm có RPO/RTO đo trong log CI"
      - name: Execute Backup PITR Restore Drill & Log RPO/RTO Measurements
        # Load and restore drills run on main only; they do not depend on a PR's diff.
        if: github.event_name != 'pull_request'
        run: |
          echo "=========================================================="
          echo " Executing Staging PITR Restore Drill in CI Environment"
          echo "=========================================================="
          node --no-warnings --experimental-strip-types infra/backup/drill-pitr.ts

      - name: Dump container logs on failure
        if: failure()
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REPO: jlpt
          IMAGE_REGISTRY: docker.io
          PROFILE: small
        run: |
          echo "Deployment or test step failed! Dumping all staging container logs:"
          docker compose -f infra/compose/compose.staging.yml logs || true

      - name: Verify Staging Teardown & Volume Cleanliness
        if: always()
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REPO: jlpt
          IMAGE_REGISTRY: docker.io
          PROFILE: small
        run: |
          docker compose -f infra/compose/compose.staging.yml down -v --remove-orphans || true
