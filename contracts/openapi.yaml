  description: Hợp đồng API toàn bộ sản phẩm JLPT Online V1-V4 (hỗ trợ thi, luyện tập, SRS, planner, AI, thanh toán, quản trị)
  title: JLPT Online Product API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/ai-content/{id}/reviews:
    post:
      operationId: adminReviewAIContent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                comment:
                  type: string
                decision:
                  enum:
                    - approve
                    - reject
                  type: string
              required:
                - decision
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  reviewed:
                    type: boolean
                type: object
          description: Đã kiểm duyệt nội dung AI
        '401':
          content:
            application/json:
              examples:
                default:
                  summary: UNAUTHENTICATED
                  value:
                    error:
                      code: UNAUTHENTICATED
                      details: {}
                      message: Yêu cầu đăng nhập.
                      requestId: req_01J00000000000000000000000
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Authentication required
        '403':
          content:
            application/json:
              examples:
                forbidden:
                  summary: FORBIDDEN
                  value:
                    error:
                      code: FORBIDDEN
                      details: {}
                      message: Bạn không có quyền thực hiện thao tác quản trị này.
                      requestId: req_01J00000000000000000000000
                twoFactorRequired:
                  summary: TWO_FACTOR_REQUIRED
                  value:
                    error:
                      code: TWO_FACTOR_REQUIRED
                      details: {}
                      message: Yêu cầu xác thực hai bước (2FA) trước khi truy cập quản trị.
                      requestId: req_01J00000000000000000000000
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Insufficient permissions or two-factor authentication required
        '404':
          content:
            application/json:
              examples:
                default:
                  summary: NOT_FOUND
                  value:
                    error:
                      code: NOT_FOUND
                      details: {}
                      message: Tài nguyên không tồn tại.
                      requestId: req_01J00000000000000000000000
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Resource not found
        '409':
          content:
            application/json:
              examples:
                default:
                  summary: VERSION_CONFLICT
                  value:
                    error:
                      code: VERSION_CONFLICT
                      details: {}
                      message: Tài nguyên đã bị thay đổi bởi phiên khác.
                      requestId: req_01J00000000000000000000000
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Version or lease conflict
        '422':
          content:
            application/json:
              examples:
                default:
                  summary: VALIDATION_ERROR
                  value:
                    error:
                      code: VALIDATION_ERROR
                      details: {}
                      message: Dữ liệu gửi lên không đúng định dạng.
                      requestId: req_01J00000000000000000000000
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Validation error
      summary: Kiểm duyệt nội dung do AI tạo trước khi lưu vào ngân hàng câu hỏi công khai
