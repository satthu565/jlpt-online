# JLPT Online - Demo Environment Docker Compose Definition (I00 / SYS-15)
# Project Name: jlpt-demo
# Profile: small (Linode Shared 4GB or local testing)
# Reverse Proxy: Caddy routing web (3200) and admin (3201) to API via same-origin /api/v1
# Mailpit: SMTP 1026 / Web UI 8226

services:
  web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-jlpt}/jlpt-web:${IMAGE_TAG:-latest}
    container_name: jlpt-demo-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=${WEB_MAX_OLD_SPACE:-320}
      - API_INTERNAL_URL=http://api:4000
      - NEXT_PUBLIC_API_URL=${API_URL:-/api/v1}
      - NEXT_PUBLIC_MEDIA_URL=${MEDIA_URL:-http://127.0.0.1:8787}
    mem_limit: ${WEB_MEM_LIMIT:-448m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jlpt-demo-net

  admin:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-jlpt}/jlpt-admin:${IMAGE_TAG:-latest}
    container_name: jlpt-demo-admin
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=${ADMIN_MAX_OLD_SPACE:-256}
      - API_INTERNAL_URL=http://api:4000
      - NEXT_PUBLIC_API_URL=${API_URL:-/api/v1}
    mem_limit: ${ADMIN_MEM_LIMIT:-320m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jlpt-demo-net

  proxy:
    image: caddy:2-alpine
    container_name: jlpt-demo-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3000"
      - "127.0.0.1:3201:3001"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - jlpt-demo-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: jlpt-demo-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8226:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jlpt-demo-net

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-jlpt}/jlpt-api:${IMAGE_TAG:-latest}
    container_name: jlpt-demo-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:4000"
    environment:
      - APP_MODE=api
      - NODE_ENV=production
      - APP_ENV=staging
      - RATE_LIMIT_NAMESPACE=demo
      - PORT=4000
      - API_WORKERS=1
      - NODE_OPTIONS=--max-old-space-size=${API_MAX_OLD_SPACE:-384}
      - DATABASE_URL=postgres://${POSTGRES_USER:-jlpt}:${POSTGRES_PASSWORD:-demo_secure_password}@postgres:5432/${POSTGRES_DB:-jlpt_demo}
      - REDIS_CORE_URL=redis://redis-core:6379
      - REDIS_CACHE_URL=redis://redis-cache:6379
      - WEB_INTERNAL_URL=http://web:3000
      - AUTH_SECRET=${AUTH_SECRET:-demo_secret_key_fixed_length_for_demo}
      - MEDIA_TOKEN_SECRET=${MEDIA_TOKEN_SECRET:-demo_media_token_secret_for_demo}
      - STORAGE_LOCAL_ROOT=/app/.data/storage
      - SMTP_URL=smtp://mailpit:1025
      - EMAIL_DRIVER=smtp
      - EMAIL_FROM=no-reply@jlpt.local
      - ENFORCE_STAFF_2FA=true
      - SENTRY_DSN=
    volumes:
      - demo-storage-data:/app/.data/storage
    mem_limit: ${API_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis-core:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - jlpt-demo-net

  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-jlpt}/jlpt-api:${IMAGE_TAG:-latest}
    container_name: jlpt-demo-worker
    restart: unless-stopped
    environment:
      - APP_MODE=worker
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=${WORKER_MAX_OLD_SPACE:-256}
      - DATABASE_URL=postgres://${POSTGRES_USER:-jlpt}:${POSTGRES_PASSWORD:-demo_secure_password}@postgres:5432/${POSTGRES_DB:-jlpt_demo}
      - REDIS_CORE_URL=redis://redis-core:6379
      - REDIS_CACHE_URL=redis://redis-cache:6379
      - STORAGE_LOCAL_ROOT=/app/.data/storage
      - AUTH_SECRET=${AUTH_SECRET:-demo_secret_key_fixed_length_for_demo}
      - MEDIA_TOKEN_SECRET=${MEDIA_TOKEN_SECRET:-demo_media_token_secret_for_demo}
      - ENFORCE_STAFF_2FA=true
    volumes:
      - demo-storage-data:/app/.data/storage
    mem_limit: ${WORKER_MEM_LIMIT:-320m}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis-core:
        condition: service_healthy
    networks:
      - jlpt-demo-net

  postgres:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-jlpt}/jlpt-postgres:${IMAGE_TAG:-latest}
    container_name: jlpt-demo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-jlpt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-demo_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-jlpt_demo}
      - WALG_S3_PREFIX=${WALG_S3_PREFIX:-s3://jlpt-backups/demo}
      - AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-mock_key}
      - AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-mock_secret}
      - AWS_ENDPOINT=${R2_ENDPOINT:-}
      - AWS_S3_FORCE_PATH_STYLE=true
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEM_LIMIT:-1024m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jlpt} -d ${POSTGRES_DB:-jlpt_demo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jlpt-demo-net

  redis-core:
    image: redis:7-alpine
    container_name: jlpt-demo-redis-core
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb"]
    volumes:
      - demo-redis-core-data:/data
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jlpt-demo-net

  redis-cache:
    image: redis:7-alpine
    container_name: jlpt-demo-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jlpt-demo-net

networks:
  jlpt-demo-net:
    name: jlpt-demo-net
    driver: bridge

volumes:
  demo-postgres-data:
  demo-redis-core-data:
  demo-storage-data:
