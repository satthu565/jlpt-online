# JLPT Online - Staging Docker Compose Definition
# Used for temporary Staging environments and CI verification drills.
# Uses profile 'small' parameters and ensures total data isolation from production and worker DBs.

services:
  web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-jlpt}/jlpt-web:${IMAGE_TAG:?IMAGE_TAG required}
    container_name: jlpt-staging-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=${WEB_MAX_OLD_SPACE:-320}
      - API_INTERNAL_URL=http://api:4000
      - NEXT_PUBLIC_API_URL=${API_URL:-http://127.0.0.1:4000/api/v1}
      - NEXT_PUBLIC_MEDIA_URL=${MEDIA_URL:-http://127.0.0.1:8787}
    mem_limit: ${WEB_MEM_LIMIT:-448m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jlpt-staging-net

  admin:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-jlpt}/jlpt-admin:${IMAGE_TAG:?IMAGE_TAG required}
    container_name: jlpt-staging-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=${ADMIN_MAX_OLD_SPACE:-256}
      - API_INTERNAL_URL=http://api:4000
      - NEXT_PUBLIC_API_URL=${API_URL:-http://127.0.0.1:4000/api/v1}
    mem_limit: ${ADMIN_MEM_LIMIT:-320m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jlpt-staging-net

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-jlpt}/jlpt-api:${IMAGE_TAG:?IMAGE_TAG required}
    container_name: jlpt-staging-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - APP_MODE=api
      - NODE_ENV=production
      - PORT=4000
      - API_WORKERS=1
      - NODE_OPTIONS=--max-old-space-size=${API_MAX_OLD_SPACE:-384}
      - DATABASE_URL=postgres://${POSTGRES_USER:-jlpt}:${POSTGRES_PASSWORD:-staging_password}@postgres:5432/${POSTGRES_DB:-jlpt_staging}
      - REDIS_CORE_URL=redis://redis-core:6379
      - REDIS_CACHE_URL=redis://redis-cache:6379
      - WEB_INTERNAL_URL=http://web:3000
      - AUTH_SECRET=${AUTH_SECRET:-staging_secret_key_fixed_length_for_tests}
      - MEDIA_TOKEN_SECRET=${MEDIA_TOKEN_SECRET:-staging_media_token_secret_for_tests}
      - SENTRY_DSN=
    mem_limit: ${API_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis-core:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - jlpt-staging-net

  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-jlpt}/jlpt-api:${IMAGE_TAG:?IMAGE_TAG required}
    container_name: jlpt-staging-worker
    restart: unless-stopped
    environment:
      - APP_MODE=worker
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=${WORKER_MAX_OLD_SPACE:-256}
      - DATABASE_URL=postgres://${POSTGRES_USER:-jlpt}:${POSTGRES_PASSWORD:-staging_password}@postgres:5432/${POSTGRES_DB:-jlpt_staging}
      - REDIS_CORE_URL=redis://redis-core:6379
      - REDIS_CACHE_URL=redis://redis-cache:6379
      - AUTH_SECRET=${AUTH_SECRET:-staging_secret_key_fixed_length_for_tests}
      - MEDIA_TOKEN_SECRET=${MEDIA_TOKEN_SECRET:-staging_media_token_secret_for_tests}
    mem_limit: ${WORKER_MEM_LIMIT:-320m}
    depends_on:
      postgres:
        condition: service_healthy
      redis-core:
        condition: service_healthy
    networks:
      - jlpt-staging-net

  postgres:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-jlpt}/jlpt-postgres:${IMAGE_TAG:-latest}
    container_name: jlpt-staging-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-jlpt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-staging_password}
      - POSTGRES_DB=${POSTGRES_DB:-jlpt_staging}
      - WALG_S3_PREFIX=${WALG_S3_PREFIX:-s3://jlpt-backups/staging}
      - AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-mock_key}
      - AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-mock_secret}
      - AWS_ENDPOINT=${R2_ENDPOINT:-}
      - AWS_S3_FORCE_PATH_STYLE=true
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEM_LIMIT:-1024m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jlpt} -d ${POSTGRES_DB:-jlpt_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jlpt-staging-net

  redis-core:
    image: redis:7-alpine
    container_name: jlpt-staging-redis-core
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb"]
    volumes:
      - staging-redis-core-data:/data
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jlpt-staging-net

  redis-cache:
    image: redis:7-alpine
    container_name: jlpt-staging-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jlpt-staging-net

networks:
  jlpt-staging-net:
    name: jlpt-staging-net
    driver: bridge

volumes:
  staging-postgres-data:
  staging-redis-core-data:
