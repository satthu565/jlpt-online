# PostgreSQL 17 configuration for large profile (Dedicated 8GB RAM) per contract A12
listen_addresses = '*'
max_connections = 100
shared_buffers = 768MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 256MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
min_wal_size = 1GB
max_wal_size = 4GB
shared_preload_libraries = 'pg_bigm'

# Backup PITR archiving settings (A12 & B3)
archive_mode = on
archive_command = 'wal-g wal-push %p'
archive_timeout = 300
