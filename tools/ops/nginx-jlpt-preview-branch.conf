# Cài: sudo cp tools/ops/nginx-jlpt-preview-branch.conf /etc/nginx/sites-available/jlpt-preview-branch && sudo ln -s ../sites-available/jlpt-preview-branch /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# Cổng 3210 trên jlpt-vm cho bản xem thử một nhánh. Dùng map $connection_upgrade đã khai báo trong sites-available/jlpt-demo.
# /api/ phải đi qua nginx và giữ Host gốc, nếu không API từ chối request ghi (bảo vệ CSRF, xem docs/agents/PITFALLS.md).
server {
  listen 3210;
  client_max_body_size 150m;
  location /api/ { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; }
  location = /auth/verify-email { proxy_pass http://127.0.0.1:4000/api/v1/auth/verify-email$is_args$args; proxy_set_header Host $http_host; }
  location / { proxy_pass http://127.0.0.1:13210; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $http_host; }
}
