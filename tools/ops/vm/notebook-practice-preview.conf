# Dedicated notebook-practice preview requested on Windows :3211.
# Install in /etc/nginx/conf.d/ after starting the web on 127.0.0.1:13221.
# Forward Windows :3211 to this loopback listener, not directly to Next.js.
# Preserve the browser Host on API requests so OriginGuard remains effective.
server {
    listen 127.0.0.1:13222;
    server_name _;
    client_max_body_size 16m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:13221;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
